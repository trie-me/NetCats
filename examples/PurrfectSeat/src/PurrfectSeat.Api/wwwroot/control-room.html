<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Catwalk — Effect Control Room</title>
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/control-room.css">
</head>
<body>
  <header><a class="brand" href="/">PurrfectSeat.com</a><span>The Catwalk — Effect Control Room</span><a href="/">Box Office ↗</a></header>
  <main>
    <section class="hero"><p class="eyebrow">Live operations, without the hairballs</p><h1>Effect Control Room</h1></section>
    <div id="kpis" class="kpis" aria-live="polite"></div>
    <div class="layout">
      <section class="card"><h2>Scenario controls</h2><label>Showtime <select id="performance"></select></label><label>Scenario <select id="scenario"></select></label><label>Virtual customers <input id="customers" type="number" value="8" min="1" max="100"></label><label>Maximum concurrency <input id="concurrency" type="number" value="4" min="1" max="32"></label><button id="run">Run scenario</button><p id="scenario-result" role="status"></p></section>
      <section class="card"><h2>Domain activity feed</h2><ol id="feed"></ol></section>
    </div>
  </main>
  <script type="module" src="/js/control-room.js"></script>
</body>
</html>
